# Releases are automatic. Commit with conventional messages (feat:, fix:, ...) and
# release-please keeps a "Release PR" open that bumps the version and changelog.
# Merging that PR creates the tag and release, and the jobs below then build the
# installers and attach them. Pushing a v* tag or running this workflow by hand
# still builds too (a manual run builds without publishing anything).
name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The scrcpy server is a platform-independent dex jar. Build it once on Linux,
  # where vendor/scrcpy/server/build_without_gradle.sh works, and share it with
  # every platform job (the script does not work on Windows).
  scrcpy-server:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build scrcpy server
        run: |
          mkdir -p "$RUNNER_TEMP/scrcpy"
          BUILD_DIR="$RUNNER_TEMP/scrcpy" bash vendor/scrcpy/server/build_without_gradle.sh
          test -s "$RUNNER_TEMP/scrcpy/scrcpy-server"

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: ${{ runner.temp }}/scrcpy/scrcpy-server
          if-no-files-found: error

  release:
    needs: [release-please, scrcpy-server]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    # The "main" ref name only appears in manual runs, which publish nothing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # build.rs embeds the scrcpy server jar built by the scrcpy-server job.
      - uses: actions/download-artifact@v4
        with:
          name: scrcpy-server
          path: scrcpy-server

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Optional macOS signing/notarization. A secret that is not set still reaches
      # the job as an empty string, and Tauri then tries to import an empty
      # certificate and fails, so only export these when a certificate exists.
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret: building unsigned."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<EOF_$v"; printenv "$v"; echo "EOF_$v"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRCPY_SERVER_PREBUILT: ${{ github.workspace }}/scrcpy-server/scrcpy-server
        with:
          tagName: ${{ needs.release-please.outputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
          releaseName: Appraiser ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
